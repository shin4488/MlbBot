version: 2
updates:
  # NuGetパッケージの定期更新（セキュリティアラート由来だけでなく通常の更新も拾う）
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    # masterへのマージは本番デプロイになるため、パッケージごとにPRを分けずまとめて1回のデプロイで済ませる
    groups:
      nuget-packages:
        patterns:
          - "*"

  # GitHub Actionsのバージョン更新（ワークフローと composite action の両方を対象にする）
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/verify-dotnet
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
