name: Deploy to AWS Lambda
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/**'
      - '.vscode/**'
      # インフラ定義の変更は関数コードに影響しない（適用はterraform applyで行う）
      - 'infra/**'
  # 手動実行。ワークフローのみの変更は.github/**がpaths-ignoreのため自動では走らず、動作確認はこちらを使う
  workflow_dispatch:

# 連続pushされても直列にデプロイし、実行中のデプロイは中断しない
concurrency:
  group: lambda-deploy
  cancel-in-progress: false

jobs:
  # ビルド・テストが通らないコードを本番にデプロイしないためのゲート
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build MlbBot.sln --configuration Release

      - name: Test
        run: dotnet test MlbBot.sln --configuration Release --no-build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # OIDCでAWSの一時認証情報を取得するための権限（このジョブのみ。指定すると他の権限は
    # 既定でnoneになるため、checkoutに必要なcontents: readも明示する）
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Configure AWS credentials
        # 長期アクセスキーではなく、GitHub OIDC + IAMロール（masterブランチ限定・コード更新権限のみ）で認証する
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish
        # Debugビルドではなく最適化されたReleaseを配置する
        # （csprojのPublishReadyToRunはpublish時のみ有効になり、コールドスタートも改善される）
        run: dotnet publish TwitterMlbBotExecution/src/TwitterMlbBotExecution --configuration Release --runtime linux-x64 --self-contained false --output publish

      - name: Package
        run: cd publish && zip -r ../TwitterMlbBotExecution.zip .

      - name: Deploy
        # update-function-codeのレスポンスには関数設定（環境変数名など）が含まれるためログに出力しない
        run: aws lambda update-function-code --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} --zip-file fileb://TwitterMlbBotExecution.zip --publish > /dev/null
