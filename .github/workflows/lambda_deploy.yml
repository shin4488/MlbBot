name: Deploy to AWS Lambda
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/**'
      - '.vscode/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      # インフラ定義の変更は関数コードに影響しない（適用はterraform applyで行う）
      - 'infra/**'
  # 手動実行。ワークフローのみの変更は.github/**がpaths-ignoreのため自動では走らず、動作確認はこちらを使う
  workflow_dispatch:

# 連続pushされても直列にデプロイし、実行中のデプロイは中断しない
concurrency:
  group: lambda-deploy
  cancel-in-progress: false

# GITHUB_TOKENの権限は既定で読み取りのみにし、OIDCが必要なdeployジョブだけで広げる
permissions:
  contents: read

jobs:
  # ビルド・テストが通らないコードを本番にデプロイしないためのゲート
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, format check and test
        uses: ./.github/actions/verify-dotnet

      # ビルド・パッケージの処理には、本番認証情報とOIDCトークン発行権限を与えない。
      - name: Publish
        run: dotnet publish TwitterMlbBotExecution/src/TwitterMlbBotExecution --configuration Release --runtime linux-x64 --self-contained false --output publish

      - name: Package
        working-directory: publish
        run: zip -r ../TwitterMlbBotExecution.zip .

      - name: Upload deployment package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-package
          path: TwitterMlbBotExecution.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: verify
    # 手動実行でもmaster以外から本番用の認証を取得しない。
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 成果物を配置するだけのジョブにOIDC権限を限定する。リポジトリのコードは実行しない。
    permissions:
      id-token: write # AWSの一時認証情報取得にのみ必要。
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-package
          path: deployment

      - name: Configure AWS credentials
        # 長期アクセスキーではなく、GitHub OIDC + IAMロール（masterブランチ限定・コード更新権限のみ）で認証する
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}
        # update-function-codeのレスポンスには関数設定（環境変数名など）が含まれるためログに出力しない
        # 更新の反映完了は待たない（aws lambda wait function-updated にはGetFunctionConfiguration権限が必要だが、
        # デプロイ用ロールはUpdateFunctionCodeのみの最小権限にしているため）
        run: aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" --zip-file fileb://deployment/TwitterMlbBotExecution.zip --publish > /dev/null
